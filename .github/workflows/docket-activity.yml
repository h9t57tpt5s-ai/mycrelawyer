name: Follow tracked federal dockets

# Runs scripts/track_dockets.py: new docket entries and closings for every
# tracker matter with a CourtListener docket, written to
# ops/docket-activity.json. The site shows them on each matter, and the
# digest routine (12:00 UTC) writes up the rulings, so this runs first.
# Also checks recent commercial real estate Chapter 11 dockets
# (ops/ch11-activity.json) and every docket a reader follows, and hands new
# rulings to the docket-follows function, which emails the followers.
# Budget 30 CourtListener requests (about 15 used), from the same 125/day
# token allowance the surveillance workflow uses (45 + 45).

on:
  schedule:
    - cron: "23 9 * * *" # ~4:30am Central
  workflow_dispatch:

permissions:
  contents: write # commits ops/docket-activity.json and ops/ch11-activity.json
  actions: write # starts the prerender job (Chapter 11 pages)

concurrency:
  group: docket-activity
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Pull new docket entries
        env:
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
          SUPABASE_ANON_KEY: sb_publishable_77xSJub0DOpnTSM4nzhVaQ_aztB5p3f
        run: python3 scripts/track_dockets.py --budget 30
      - name: Commit the docket activity
        run: |
          git add ops/docket-activity.json
          git add ops/ch11-activity.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git config user.name "credocket-docket-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Docket activity: record daily pull"
          # Rebase and retry: several jobs push to main around the same minutes
          # (2026-10-01: a rejected push left live-208/209 looking unsynced).
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            sleep $((i * 10))
          done
          [ "$ok" = 1 ]
      # Commits pushed by this job do not start other workflows.
      - name: Rebuild the Chapter 11 pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run prerender.yml --ref main || echo "::warning::Could not start the prerender job"
