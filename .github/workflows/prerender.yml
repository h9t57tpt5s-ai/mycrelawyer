name: Prerender counts and matter lists

# Bakes the dataset into the HTML (homepage counts, the tracker's first
# page, company matter lists, the coverage page) so they are visible
# without JavaScript. Runs after every push that changes js/data.js,
# which is how the digest routine publishes new matters.

on:
  push:
    branches: [main]
    paths:
      - "js/data.js"
      - "js/corrections.json"
      - "scripts/prerender.ts"
      - "scripts/render_corrections.py"
      - "scripts/build_matter_pages.ts"
      - "scripts/build_entity_pages.ts"
      - "scripts/build_og_images.py"
      - "scripts/build_trackers.ts"
      - "scripts/build_value_pages.ts"
      - "js/backtest-results-data.js"
      - "scripts/build_sitemap.py"
      - "scripts/build_data_lite.ts"
      - "scripts/build_record_pages.ts"
      - "bankruptcy-watch.html"
      - "lawsuit-watch.html"
  # Also started by court-filings-ingest.yml and docket-activity.yml after
  # they commit new petitions or docket entries (their own pushes cannot
  # trigger this workflow).
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prerender
  cancel-in-progress: false

jobs:
  prerender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build_sitemap.py dates each page by its last commit
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # The slim dataset pages load (write-ups and timelines split out).
      - run: deno run --allow-read --allow-write scripts/build_data_lite.ts
      - run: deno run --allow-read --allow-write --allow-net scripts/prerender.ts
      - run: python3 scripts/render_corrections.py
      # Company, agency and property pages (2+ matters each), then one
      # indexable page per matter (which links to them), then the sitemap.
      # Share image per matter (and the site default), drawn with Ubuntu's
      # Noto Serif, Inter and IBM Plex Mono packages.
      - name: Share images
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-core fonts-inter fonts-ibm-plex >/dev/null
          pip install --quiet pillow==11.3.0
          python3 scripts/build_og_images.py
      # Topic trackers and the monthly CRE Litigation Index.
      - run: deno run --allow-read --allow-write scripts/build_trackers.ts
      # "What is it worth?" pages and the calculator's real-cases block.
      - run: deno run --allow-read --allow-write scripts/build_value_pages.ts
      - run: deno run --allow-read --allow-write scripts/build_entity_pages.ts
      - run: deno run --allow-read --allow-write scripts/build_matter_pages.ts
      # Chapter 11 Watch and Federal Lawsuit Watch, and one page per petition or case.
      - run: deno run --allow-read --allow-write scripts/build_record_pages.ts
      - run: python3 scripts/build_sitemap.py
      - name: Commit prerendered pages
        run: |
          git add -A matters chapter-11 federal-cases parties properties js/entity-index.json img/og img/og-image.png js/topic-index.json *-tracker.html litigation-index*.html case-valuation.html commercial-lease-dispute-damages.html commercial-foreclosure-guaranty-damages.html construction-defect-damages.html condemnation-compensation.html land-use-litigation-damages.html commercial-premises-liability-damages.html reit-securities-claim-value.html environmental-cleanup-cost-claims.html
          git add bankruptcy-watch.html lawsuit-watch.html
          git add index.html litigation.html coverage.html companies.html judges.html company-*.html corrections.html sitemap.xml news-sitemap.xml js/data-lite.js js/matter-text.json
          if git diff --cached --quiet; then echo "Nothing changed."; exit 0; fi
          git config user.name "credocket-prerender-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Prerender: bake current counts and matter lists into the HTML"
          # Other commits land on main while a long run is in flight; rebase
          # so the results push is never rejected and the API spend lost.
          # Rebase and retry: several jobs push to main around the same minutes
          # (2026-10-01: a rejected push left live-208/209 looking unsynced).
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            sleep $((i * 10))
          done
          [ "$ok" = 1 ]
          # After the rebase, HEAD is this job's commit; IndexNow announces its pages.
          echo "BUILT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      # Tell Bing and the other IndexNow engines which pages changed, once
      # Vercel has deployed them. Google reads the sitemap instead.
      - name: Announce changed pages (IndexNow)
        run: |
          sleep 90
          if [ "${{ github.event_name }}" = "push" ]; then
            range="${{ github.event.before }}..HEAD"
          elif [ -n "${BUILT:-}" ]; then
            range="${BUILT}~1..${BUILT}"
          else
            echo "Nothing rebuilt; nothing to announce."; exit 0
          fi
          python3 scripts/indexnow.py "$range" || echo "::warning::IndexNow submission failed"
