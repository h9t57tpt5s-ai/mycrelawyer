name: Counterparty surveillance — daily federal filings pull

# Runs scripts/ingest_court_filings.py on a GitHub-hosted runner: the pull
# is rate-limited to one CourtListener request every 13 seconds, far longer
# than a Supabase Edge Function may run, so the slow half lives here and
# the Edge Function (ingest-court-filings) does storage, matching and email.
#
# COURTLISTENER_TOKEN is optional. Without it the job still pulls every new
# Chapter 11 petition but can search only a handful of portfolio entities.

on:
  schedule:
    # Twice a day so a filing that reaches the record during the day is
    # alerted the same day. Odd minutes: GitHub delays top-of-hour cron.
    - cron: "37 11 * * *" # ~6:30am Central, ahead of the 7am morning digest
    - cron: "37 22 * * *" # ~5:30pm Central
  workflow_dispatch:
    inputs:
      window_days:
        description: "Days back to pull (default 3; use 30 for a one-time backfill)"
        default: "3"

permissions:
  contents: write # commits the public alert log after every run

concurrency:
  group: court-filings-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Pull new federal filings and match portfolios
        env:
          SUPABASE_ANON_KEY: sb_publishable_77xSJub0DOpnTSM4nzhVaQ_aztB5p3f
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          WINDOW_DAYS: ${{ inputs.window_days || '3' }}
          WRITE_ALERT_LOG: "1"
        # Two runs a day share CourtListener's 125-request daily allowance.
        run: python3 scripts/ingest_court_filings.py --budget 60
      - name: Commit the alert log
        # Runs even when the ingest step failed: a failed run belongs in
        # the public log too.
        if: always()
        run: |
          git add alert-log.html ops/alert-runs.json ops/alert-audit.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing to record."; exit 0; fi
          git config user.name "credocket-surveillance-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Alert log: record surveillance run"
          git pull --rebase origin main
          git push
