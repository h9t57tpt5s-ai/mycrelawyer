name: Counterparty surveillance — daily federal filings pull

# Runs scripts/ingest_court_filings.py on a GitHub-hosted runner: the pull
# is rate-limited to one CourtListener request every 13 seconds, far longer
# than a Supabase Edge Function may run, so the slow half lives here and
# the Edge Function (ingest-court-filings) does storage, matching and email.
#
# COURTLISTENER_TOKEN is optional. Without it the job still pulls every new
# Chapter 11 petition but can search only a handful of portfolio entities.

on:
  schedule:
    # Twice a day so a filing that reaches the record during the day is
    # alerted the same day. Odd minutes: GitHub delays top-of-hour cron.
    - cron: "37 11 * * *" # ~6:30am Central, ahead of the 7am morning digest
    - cron: "37 22 * * *" # ~5:30pm Central
  workflow_dispatch:
    inputs:
      window_days:
        description: "Days back to pull (default 3; use 30 for a one-time backfill)"
        default: "3"

permissions:
  contents: write # commits the public alert log after every run
  actions: write # starts the prerender job (Chapter 11 pages)

concurrency:
  group: court-filings-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 100  # the Texas step OCRs scanned notices
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Pull new federal filings and match portfolios
        env:
          SUPABASE_ANON_KEY: sb_publishable_77xSJub0DOpnTSM4nzhVaQ_aztB5p3f
          AUTOMATION_SECRET: ${{ secrets.AUTOMATION_SECRET }}
          COURTLISTENER_TOKEN: ${{ secrets.COURTLISTENER_TOKEN }}
          WINDOW_DAYS: ${{ inputs.window_days || '3' }}
          WRITE_ALERT_LOG: "1"
        # Two runs a day share CourtListener's 125-request daily allowance
        # with the docket tracker (docket-activity.yml, up to 35) and opinion-leads.yml (20): 35+35+35+20.
        # A run actually uses about 8, plus 2-4 for the federal suits pull;
        # this is the ceiling.
        run: python3 scripts/ingest_court_filings.py --budget 35
      - name: Pull new state court filings (State Court Watch)
        # Free state and county court data only (scripts/pull_state_filings.py);
        # a failing source keeps its earlier rows and never blocks the rest.
        continue-on-error: true
        run: |
          pip install --quiet pypdf==6.16.1  # reads Maryland's daily Cases Filed Report
          python3 scripts/pull_state_filings.py --days 21
      - name: Pull newly distressed CMBS properties (CMBS Distress Watch)
        # Each CMBS trust's monthly SEC loan tape (Form ABS-EE, Exhibit 102)
        # compared with its previous one (scripts/pull_cmbs_distress.py).
        continue-on-error: true
        timeout-minutes: 40
        run: python3 scripts/pull_cmbs_distress.py --days 10
      - name: Pull Texas commercial foreclosure-sale notices (Texas Foreclosure Sales)
        # County clerk notices of trustee's sale, kept only when the appraisal
        # district classifies the parcel as commercial (scripts/pull_tx_foreclosures.py).
        # Harris and Williamson notices are scanned images (Tesseract OCR);
        # Collin's list renders only in a browser (Playwright Chromium);
        # Dallas and Fort Bend post PDFs with a text layer (pypdf).
        continue-on-error: true
        timeout-minutes: 55
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq tesseract-ocr poppler-utils >/dev/null
          pip install --quiet playwright==1.60.0 pypdf==6.16.1
          python3 -m playwright install --with-deps chromium >/dev/null
          python3 scripts/pull_tx_foreclosures.py --limit 60
      - name: Commit the alert log
        # Runs even when the ingest step failed: a failed run belongs in
        # the public log too.
        if: always()
        run: |
          git add alert-log.html ops/alert-runs.json ops/alert-audit.json ops/fresh-filings.json ops/ch11-petitions.json ops/federal-suits.json ops/state-filings.json ops/cmbs-distress.json ops/tx-foreclosures.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "Nothing to record."; exit 0; fi
          git config user.name "credocket-surveillance-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Alert log: record surveillance run"
          # Rebase and retry: several jobs push to main around the same minutes
          # (2026-10-01: a rejected push left live-208/209 looking unsynced).
          ok=0
          for i in 1 2 3; do
            if git pull --rebase origin main && git push; then ok=1; break; fi
            sleep $((i * 10))
          done
          [ "$ok" = 1 ]
      # Commits pushed by this job do not start other workflows, so ask the
      # prerender job to rebuild Chapter 11 Watch and the chapter-11/ pages.
      - name: Rebuild the Chapter 11 pages
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run prerender.yml --ref main || echo "::warning::Could not start the prerender job"
